<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first grid</title>
    <!-- Paste inside <head> -->
    
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        h1{
            text-align:center;
            color:rosybrown;
        }

        body{
            background-color: palegoldenrod;
            padding: 25px;
        }
        .hobby-card{
            border: 2px solid black;
            text-align:center;
            padding: 15px;
            border-radius: 20px;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>Hobby Cards</h1>
    <div class="container">

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">

                <div class="hobby-card">
                    <h3>Coding</h3>
                    <p>I love programming</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
            
                <div class="hobby-card">
                    <h3>Singing</h3>
                    <p>I love singing</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
            
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love drawing</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
