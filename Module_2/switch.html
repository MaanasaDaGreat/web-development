<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>The day is <span id="day"></span></h1>
    <script>
        var day;
        switch(new Date().getDay()){
            case 0:
                day = "Sunday";
                break;

            case 1:
                day = "Monday";
                break;

            case 4:
                day = "Friday";
                break;

            default:
                day = "Invalid Day";
                break;
        }
        document.getElementById("day").innerHTML = day;
    </script>
</body>
</html>
